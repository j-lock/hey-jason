name: Build Hey, Jason

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build APK
        run: gradle assembleRelease --stacktrace --no-daemon

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk HeyJason.apk

      - uses: actions/upload-artifact@v4
        with:
          name: HeyJason
          path: HeyJason.apk

      - name: Publish download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Hey, Jason v1.0.${{ github.run_number }}
          body: Tap HeyJason.apk below to download and install on your phone.
          files: HeyJason.apk
          make_latest: true
