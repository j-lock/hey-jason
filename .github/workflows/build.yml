name: Build Hey, Jason

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          if ! gradle assembleRelease --no-daemon --console=plain 2>&1 | tee build.log; then
            # Surface the key error lines as an annotation so they're readable without the raw log.
            msg=$(grep -E "^e: |error:|What went wrong|Could not|Failed|Exception" build.log | head -40 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=Build failed::${msg}"
            exit 1
          fi

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk HeyJason.apk

      - uses: actions/upload-artifact@v4
        with:
          name: HeyJason
          path: HeyJason.apk

      - name: Publish download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Hey, Jason v1.0.${{ github.run_number }}
          body: Tap HeyJason.apk below to download and install on your phone.
          files: HeyJason.apk
          make_latest: true
